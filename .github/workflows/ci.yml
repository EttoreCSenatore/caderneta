name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs (build pt-BR)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --audit-level=high --omit=dev
      - name: Documentação em português e inglês (mesma estrutura)
        run: python3 ../scripts/checar-traducao.py
      - name: Licenças das dependências (AGPL-3.0)
        run: python3 ../scripts/auditar-licencas.py --npm website
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: website/build

  api:
    name: API (lint, testes com Postgres, auditoria)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
        env:
          POSTGRES_USER: caderneta_owner
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: caderneta
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U caderneta_owner" --health-interval 3s --health-retries 20
    env:
      CADERNETA_DATABASE_URL: postgresql+psycopg://caderneta_app:ci-app@127.0.0.1:5433/caderneta_test
      CADERNETA_OWNER_DATABASE_URL: postgresql+psycopg://caderneta_owner:ci-owner@127.0.0.1:5433/caderneta_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Papéis do banco (mesmo script do ambiente de dev)
        working-directory: infra/postgres/init
        env:
          PGPASSWORD: ci-owner
          POSTGRES_USER: caderneta_owner
          POSTGRES_DB: caderneta
          APP_DB_PASSWORD: ci-app
        run: sed 's/psql /psql -h 127.0.0.1 -p 5433 /' 01-roles.sh | sh
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest -p no:warnings
      - run: pip-audit --skip-editable
      - name: SBOM da API (CycloneDX)
        run: pip-audit --skip-editable -f cyclonedx-json -o ../sbom-api.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-api
          path: sbom-api.cdx.json
      - name: Licenças das dependências (AGPL-3.0)
        run: python ../scripts/auditar-licencas.py --python

  web:
    name: Web (typecheck, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - name: SBOM do app web (CycloneDX)
        run: npm sbom --omit=dev --sbom-format cyclonedx > ../sbom-web.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-web
          path: sbom-web.cdx.json
      - name: Licenças das dependências (AGPL-3.0)
        run: python3 ../scripts/auditar-licencas.py --npm web
      - run: npm run build

  imagens:
    name: Imagens de produção (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Actions fixadas por commit e imagens por digest, iguais em todos os arquivos
        run: python3 scripts/checar-fixacao.py
      - name: Imagem da API e do worker
        run: docker build -f deploy/Dockerfile.api -t caderneta-api:ci .
      - name: Imagem do site (build do app + Caddy)
        run: docker build -f deploy/Dockerfile.web -t caderneta-web:ci .
      - name: Valida o compose de produção
        working-directory: deploy
        run: |
          cp .env.example .env
          OWNER_DB_PASSWORD=x APP_DB_PASSWORD=x docker compose -f docker-compose.prod.yml config --quiet
          docker run --rm -e CADERNETA_DOMAIN=ci.example.com -e CADERNETA_ACME_EMAIL=ci@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0 caddy validate --config /etc/caddy/Caddyfile

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [docs, api, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
  # MO.3: a cada versão nova no topo do releases.yaml, cria a tag vX.Y.Z e a release do GitHub com as notas.
  # Só na main, depois de tudo verde. Se a tag já existe, não faz nada (o job roda em todo push).
  release:
    name: Release da versão
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [docs, api, web, imagens]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # criar a tag e a release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install "pyyaml>=6.0.2"
      - name: Cria a release se a versão for nova
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=$'\t' read -r versao titulo < <(python3 scripts/notas-versao.py --texto notas.md)
          if gh release view "v$versao" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$versao já publicada"
          else
            gh release create "v$versao" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "v$versao: $titulo" --notes-file notas.md
          fi
