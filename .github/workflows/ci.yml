name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs (build pt-BR)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  api:
    name: API (lint, testes com Postgres, auditoria)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caderneta_owner
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: caderneta
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U caderneta_owner" --health-interval 3s --health-retries 20
    env:
      CADERNETA_DATABASE_URL: postgresql+psycopg://caderneta_app:ci-app@127.0.0.1:5433/caderneta_test
      CADERNETA_OWNER_DATABASE_URL: postgresql+psycopg://caderneta_owner:ci-owner@127.0.0.1:5433/caderneta_test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Papéis do banco (mesmo script do ambiente de dev)
        working-directory: infra/postgres/init
        env:
          PGPASSWORD: ci-owner
          POSTGRES_USER: caderneta_owner
          POSTGRES_DB: caderneta
          APP_DB_PASSWORD: ci-app
        run: sed 's/psql /psql -h 127.0.0.1 -p 5433 /' 01-roles.sh | sh
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest -p no:warnings
      - run: pip-audit --skip-editable

  web:
    name: Web (typecheck, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [docs, api, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
